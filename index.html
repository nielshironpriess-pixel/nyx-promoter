<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Niels Bordbog</title>
  <meta name="theme-color" content="#f5efe3">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bordbog">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <style>
/* Layout: phone app modelled on the Nyx staff app. Dark only on purpose: same navy, teal and green as Nyx so it feels familiar. */
:root{
  color-scheme:light;
  --bg:#f5efe3; --surface:#fffaf2; --raise:#efe6d6; --line:#e3d7c3; --mapbg:#efe7d8;
  --fg:#2b1d1f; --muted:#7f6e68; --faint:#ab9d93;
  --teal:#7b2433; --pink:#7b2433; --green:#5c6b2e; --green-ink:#fbf6ec; --gold:#e8cf9a;
  --blue:#5c6b2e; --blue-ink:#fbf6ec; --red:#b4685a; --red-ink:#fbf6ec; --purple:#8a6a8f;
  --free:#fffdf8; --free-ink:#3a2a2c; --stripe1:#ece3d3; --stripe2:#e4d9c6;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body,button,a,input,select,textarea,label{touch-action:manipulation}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f);font-size:15px;line-height:1.4;margin:0;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 0}
.top .title{text-align:center;line-height:1.2}
.top .title b{display:block;font-family:var(--serif);font-weight:700;font-size:22px;color:var(--teal)}
.top .title .d{color:var(--pink);font-weight:600}
.top .title span{color:var(--muted);font-size:15px}
.pillbtn{justify-self:start;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600}
.top .right{justify-self:end}
h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}

/* events */
.ev{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.ev.today{border-color:var(--teal)}
.ev{box-shadow:0 1px 2px rgba(80,50,30,.06)}
.ev.thu{background:var(--teal);border-color:var(--teal);color:var(--green-ink)}
.ev.thu .t,.ev.thu .stats{color:#e6c9c4}
.ev.thu .stats b{color:var(--green-ink)}
.ev.thu.today{box-shadow:0 0 0 3px var(--gold)}
.ev .r1,.ev .r2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ev .wd{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.wd.thu{color:var(--gold)}.wd.fri{color:var(--teal)}.wd.sat{color:var(--teal)}.wd.other{color:var(--muted)}
.ev .t{font-size:13px;color:var(--muted)}
.ev .name{font-weight:600;margin-top:2px}
.ev .stats{font-size:13px;color:var(--muted);text-align:right}
.ev .stats b{color:var(--green);font-weight:700}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* night */
.seg{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.seg button{background:none;border:0;padding:12px 0;font-size:16px;color:var(--muted);border-bottom:3px solid transparent}
.seg button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--teal)}
.glist{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:14px}
.glist .k{font-size:13px;color:var(--muted)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--raise);font-size:20px;line-height:1}
.step input{width:56px;text-align:center;font-size:22px;font-weight:700;background:none;border:0}
.areabar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px}
.areabar .nav{display:flex;align-items:center;gap:6px;min-width:0}
.areabar .nav button{width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.areabar .nm{font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counts{display:flex;gap:10px;font-size:18px;font-weight:600}
.c-green{color:var(--teal)}.c-blue{color:var(--blue)}.c-red{color:var(--red)}

.map{position:relative;container-type:inline-size;background:var(--mapbg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.map > *{position:absolute}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:2.3cqw;color:var(--fg);text-align:center}
.blk.v span{transform:rotate(90deg);white-space:nowrap}
.hatch{border:1px solid var(--line);border-radius:4px;background:repeating-linear-gradient(135deg,var(--stripe1) 0 1.6cqw,var(--stripe2) 1.6cqw 3.2cqw);display:grid;place-items:center;font-size:2.3cqw}
.tb{border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:4px;background:var(--free);color:var(--free-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:.4cqw;font-size:2.4cqw;overflow:hidden}
.tb b{font-size:2.9cqw}
.tb small{font-size:2.2cqw;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb.round{border-radius:99px}
.tb.booket,.tb.kom,.tb.udeblev{box-shadow:none}
.tb.booket{background:var(--teal);color:var(--green-ink)}
.tb.kom{background:var(--blue);color:var(--blue-ink)}
.tb.udeblev{background:var(--red);color:var(--red-ink)}
.maptip{font-size:13px;color:var(--muted);margin-top:8px}

/* lists */
.crow{display:flex;align-items:center;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow[hidden]{display:none}
.crow .row{border-top:0;flex:1;min-width:0}
.cbtn{flex:none;min-width:44px;height:40px;margin-right:10px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-weight:800;color:var(--teal);display:grid;place-items:center;text-decoration:none;font-size:14px}
.cbtn.ig{background:linear-gradient(45deg,#f6b74d,#d6336c 55%,#7b3fbf);color:#fff;border:0}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.tag{min-width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:var(--free);color:var(--free-ink);padding:0 6px}
.tag.booket{background:var(--teal);color:var(--green-ink)}.tag.kom{background:var(--blue);color:var(--blue-ink)}.tag.udeblev{background:var(--red);color:var(--red-ink)}.tag.aflyst{background:var(--raise);color:var(--muted)}
.mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.mid .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;font-weight:700}
.right small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.empty{padding:20px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.teal{background:var(--teal);color:var(--green-ink);border-color:var(--teal)}
.btn.danger{color:var(--red)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;color:var(--muted)}

/* stats */
.monthsw{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.monthsw strong{font-size:17px;text-transform:capitalize}
.monthsw button{width:36px;height:36px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:12px}
.cmp .line{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;font-size:14px}
.cmp .bar{height:12px;border-radius:99px;background:var(--raise);overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:99px}
.cmp .big{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1}
.cmp .sub{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .v{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--green)}
.tile .k{font-size:12px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 4px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--f);font-size:11px}
.chart .val{fill:var(--fg);font-weight:600}
.todo{border-color:var(--pink)}

/* notes */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--teal);color:var(--fg)}
.idea{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.idea:first-child{border-top:0}
.idea input[type=checkbox]{width:20px;height:20px;margin-top:1px;accent-color:var(--teal)}
.idea p{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.idea.done p{color:var(--faint);text-decoration:line-through}
.idea button{background:none;border:0;color:var(--faint);font-size:18px;line-height:1;padding:0 2px}
.quick{display:flex;gap:8px;margin-bottom:10px}
.quick input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}

.fu{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.fu:first-child{border-top:0}
.fu .acts{display:flex;gap:6px}
.fu .acts button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}
.fu .acts button.ok{background:var(--teal);color:var(--green-ink);border-color:var(--teal)}
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .logo{font-family:var(--serif);font-weight:700;font-size:56px;letter-spacing:.08em;color:var(--teal);line-height:1}
.login .err{color:var(--red);font-size:14px;min-height:1.2em;margin:0}
[hidden]{display:none!important}
/* tabbar (Nyx style pill) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px;box-shadow:0 8px 24px rgba(80,50,30,.14)}
nav.tabs button{border:0;background:none;border-radius:99px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:12px;font-weight:700;color:var(--fg)}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{background:var(--bg);color:var(--teal)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 12px);overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--serif);font-size:24px;color:var(--teal);margin:0 0 4px}
.sheet .sh{color:var(--muted);font-size:14px;margin:0 0 14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;width:100%;min-width:0;color:var(--fg)}
label.f textarea{min-height:60px;resize:vertical}
/* iPhone: rolig bordark uden sidelæns rystelser */
.sheet{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.scrim{overscroll-behavior:contain}
html:has(.scrim),body:has(.scrim){overflow:hidden}
.sheet form,.sheet label.f{max-width:100%}
label.f input[type=date],label.f input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-height:44px;max-width:100%;text-align:left}
label.f input::-webkit-date-and-time-value{text-align:left;margin:0}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.status button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0;font-size:13px;font-weight:700;color:var(--muted)}
.status button[aria-pressed="true"].booket{background:var(--teal);color:var(--green-ink);border-color:var(--teal)}
.status button[aria-pressed="true"].kom{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.status button[aria-pressed="true"].udeblev{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.status button[aria-pressed="true"].aflyst{background:var(--raise);color:var(--fg)}
.sheet .btns{margin-top:16px;justify-content:space-between}
.toast{background:var(--teal)!important;color:var(--green-ink)!important;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px}
.foot{font-size:12px;color:var(--faint);text-align:center;padding-top:18px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.scanbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:4px 0 14px}
.scanbar{height:6px;border-radius:99px;background:var(--raise);overflow:hidden;margin-top:14px}
.scanbar i{display:block;height:100%;width:40%;background:var(--green);border-radius:99px;animation:scan 1.2s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateX(-20%)}to{transform:translateX(170%)}}
.scanlist{display:flex;flex-direction:column;gap:10px}
.scanrow{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg)}
.scanrow.off{opacity:.5}
.scanrow.off .sgrid{display:none}
.scanrow .chk{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;margin-bottom:8px}
.scanrow .chk input{width:20px;height:20px;accent-color:var(--teal)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sgrid .full{grid-column:1/-1}
label.f small.mer{text-transform:none;letter-spacing:0;font-size:13px;color:var(--green);font-weight:700}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--teal)}
.srow .right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.linkbtn{background:none;border:0;color:var(--teal);font-weight:700;font-size:13px;padding:2px 0}
.scanrow .sgrid{margin-top:10px}
.scanrow.off .srow .mid,.scanrow.off .srow .right{opacity:.6}
.spentbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.spentbox .sbh{grid-column:1/-1;font-family:var(--serif);font-size:17px;color:var(--teal)}
.spentbox [data-minonly]{align-self:center}
.badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:99px;background:var(--teal);color:var(--green-ink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
nav.tabs button{position:relative}
.row.news .dot{width:10px;height:10px;border-radius:99px;background:transparent;align-self:start;margin-top:6px}
.row.news.new .dot{background:var(--teal)}
.row.news.new .t{font-weight:700}
label.share{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
label.share input{width:22px;height:22px;accent-color:var(--teal);margin-top:2px}
label.share small{color:var(--muted)}
.cmp.pool{margin-bottom:12px}
#l-toggle{margin-top:6px}
.avatar{justify-self:end;width:38px;height:38px;border-radius:99px;border:0;background:var(--teal);color:var(--green-ink);font-weight:800;font-size:14px;display:grid;place-items:center;letter-spacing:.02em}
.avatar.big{width:56px;height:56px;font-size:20px;flex:none}
.phead{display:flex;gap:14px;align-items:center}

/* ---------- skal: topbar, sidemenu og forside (som i Goon) ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 0 6px;background:var(--bg);max-width:640px;margin:0 auto;box-sizing:border-box;width:100%}
.topbar .brand{text-align:center}
.brand{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--teal);letter-spacing:.02em}
.brand.big{font-size:30px}
.brand-sub{color:var(--muted);font-size:13px;margin:2px 0 18px}
.tb-menu{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.tb-menu svg{width:22px;height:22px}
.topbar .avatar{justify-self:end}
.top{top:calc(56px + env(safe-area-inset-top,0px))}
.top .avatar{display:none}
.side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:30;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(22px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-105%);transition:transform .22s;overflow:auto;border-radius:0 24px 24px 0}
.side.open{transform:none;box-shadow:0 0 40px rgba(60,30,20,.25)}
.sidescrim{position:fixed;inset:0;background:rgba(40,20,15,.35);z-index:29;display:none}
.sidescrim.open{display:block}
.snav{display:flex;flex-direction:column;gap:2px}

  nav.tabs{display:none}

.hello{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.1;color:var(--teal);margin:2px 0 16px}
.hero{display:block;width:100%;text-align:left;background:var(--teal);color:var(--green-ink);border:0;border-radius:22px;padding:18px;box-shadow:0 10px 24px rgba(123,36,51,.25)}
.hero .lab{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e6c9c4}
.hero .ttl{font-family:var(--serif);font-size:28px;font-weight:700;margin:4px 0 2px}
.hero .sub{color:#f1dcd6;font-size:14px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:block;width:100%}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--green);margin-top:6px;line-height:1.1}
.kpi .s{font-size:13px;color:var(--muted);margin-top:4px}
.quick:has(.qa){display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 6px;font-weight:700;font-size:13px}
.qa svg{width:24px;height:24px;color:var(--teal)}
.todo-row .bub{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:var(--green-ink);background:var(--teal);font-size:14px}
.todo-row .bub.olive{background:var(--green)}.todo-row .bub.gold{background:var(--gold);color:var(--fg)}
.hseg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--raise);border-radius:12px;padding:4px;margin:4px 0 12px}
.hseg.three{grid-template-columns:repeat(3,1fr)}
.shero{background:var(--teal);color:var(--green-ink);border-radius:22px;padding:18px;margin-top:12px;box-shadow:0 10px 24px rgba(123,36,51,.22)}
.shero .lab{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e6c9c4}
.shero .amt{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1.1;margin:4px 0 2px}
.shero .prog{height:8px;background:rgba(255,255,255,.18);border-radius:99px;margin:12px 0 8px;overflow:hidden}
.shero .prog i{display:block;height:100%;background:var(--gold);border-radius:99px}
.shero .row2{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#f1dcd6}
.shero .prov{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;margin-top:14px;padding:12px 0 0;border:0;border-top:1px solid rgba(255,255,255,.2);background:none;color:inherit;font:inherit;text-align:left}
.shero .prov b{font-family:var(--serif);font-size:22px;color:var(--gold)}
.salert{margin-top:10px;border-color:var(--gold)!important}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.fchip span{opacity:.7;margin-left:2px}
.fchip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--green-ink)}
.pill{display:inline-block;background:var(--gold);color:var(--fg);border-radius:99px;padding:3px 9px;font-size:13px;font-weight:700}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin:0 2px 0 6px}
details.more{margin-top:22px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:0 14px 14px}

details.more:not([open]){padding-bottom:0}

.hseg button{border:0;background:none;border-radius:9px;padding:9px 0;font-weight:700;color:var(--muted)}
.hseg button[aria-pressed="true"]{background:var(--surface);color:var(--teal);box-shadow:0 1px 3px rgba(60,30,20,.1)}

/* ---------- glas-look (Apple-agtig) ---------- */
:root{
  --glass:rgba(255,251,245,.58); --glass-hi:rgba(255,252,247,.74); --glass-line:rgba(255,255,255,.62);
  --glass-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 10px 30px rgba(92,40,30,.08),0 1px 2px rgba(92,40,30,.06);
  --blur:blur(18px) saturate(180%); --blur-strong:blur(28px) saturate(190%);
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.2,.8,.2,1);
}
html{background:
  radial-gradient(60vmax 50vmax at 0% 0%,rgba(123,36,51,.16),transparent 60%),
  radial-gradient(55vmax 45vmax at 100% 18%,rgba(232,207,154,.42),transparent 62%),
  radial-gradient(60vmax 50vmax at 30% 100%,rgba(92,107,46,.14),transparent 60%),
  var(--bg) fixed;background-attachment:fixed}
body{background:transparent}
*{-webkit-tap-highlight-color:transparent}
body::before{background:rgba(245,239,227,.6);-webkit-backdrop-filter:var(--blur-strong);backdrop-filter:var(--blur-strong)}

/* flader */
.list,.ev,.cmp,.tile,.chart,.kpi,.qa,.empty,details.more,.me-card,.monthsw button,.tb-menu,.fchip,.btn:not(.teal):not(.danger){
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}
.list{border-radius:18px}.ev,.cmp,.tile,.chart{border-radius:18px}
.empty{border-style:solid}
.row{border-top-color:rgba(120,80,60,.10)}
.crow{border-top-color:rgba(120,80,60,.10)}
.ev.thu{background:linear-gradient(150deg,rgba(141,43,60,.94),rgba(106,29,43,.94));border-color:rgba(255,255,255,.18)}

/* bjælker: topbar, sidehoved, tabbar, sidemenu */
.topbar,.top{background:rgba(245,239,227,.55);-webkit-backdrop-filter:var(--blur-strong);backdrop-filter:var(--blur-strong)}
.topbar{border-radius:0 0 18px 18px}
nav.tabs .in{background:rgba(255,251,245,.55);-webkit-backdrop-filter:var(--blur-strong);backdrop-filter:var(--blur-strong);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 14px 40px rgba(92,40,30,.18)}
nav.tabs button{transition:background .3s var(--ease),color .3s var(--ease),transform .2s var(--ease)}
nav.tabs button[aria-current="page"]{background:rgba(255,255,255,.75);box-shadow:0 1px 0 #fff inset,0 2px 8px rgba(92,40,30,.12)}
.side{background:rgba(255,251,245,.68);-webkit-backdrop-filter:var(--blur-strong);backdrop-filter:var(--blur-strong);
  border-right:1px solid rgba(255,255,255,.6);transition:transform .42s var(--spring)}
.snav button{transition:background .25s var(--ease)}
.snav button[aria-current="page"]{background:rgba(255,255,255,.7);box-shadow:0 1px 0 #fff inset,0 2px 8px rgba(92,40,30,.08)}
.sidescrim{background:rgba(40,20,15,.22);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .3s var(--ease)}

/* segmenter */
.seg{border:0;margin:0 0 12px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);border-radius:14px;padding:4px;gap:4px}
.seg button{border-bottom:0;border-radius:10px;padding:9px 0;font-weight:700;font-size:15px;transition:background .3s var(--ease),color .3s var(--ease)}
.seg button[aria-pressed="true"],.hseg button[aria-pressed="true"]{background:rgba(255,255,255,.85);color:var(--teal);box-shadow:0 1px 0 #fff inset,0 2px 8px rgba(92,40,30,.12)}
.hseg{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line)}
.hseg button{transition:background .3s var(--ease),color .3s var(--ease)}
.fchip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}

/* kort med farve får glans */
.hero,.shero{background:linear-gradient(150deg,#8f2d3f 0%,#7b2433 45%,#5f1a28 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 16px 36px rgba(123,36,51,.28);position:relative;overflow:hidden}
.hero::after,.shero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 85% -20%,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.btn.teal{background:linear-gradient(180deg,#8d2b3c,#7b2433);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px rgba(123,36,51,.25)}

/* ark (sheets) */
.scrim{background:rgba(40,20,15,.26);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .3s var(--ease)}
.sheet{background:rgba(255,251,245,.84);-webkit-backdrop-filter:var(--blur-strong);backdrop-filter:var(--blur-strong);
  border:1px solid rgba(255,255,255,.7);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(92,40,30,.18);animation:sheetIn .5s var(--spring)}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:99px;background:rgba(92,40,30,.18);margin:-8px auto 12px}
.scrim.out{animation:fadeOut .24s var(--ease) forwards}
.scrim.out .sheet{animation:sheetOut .24s var(--ease) forwards}
label.f input,label.f select,label.f textarea,.status button,.spentbox,label.share,.scanrow{background:rgba(255,255,255,.6);border-color:rgba(120,80,60,.14)}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(123,36,51,.12);background:#fff}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}

/* bevægelse */
#view.enter{animation:viewIn .38s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
button,.row,.ev,.kpi,.qa,.hero,a.cbtn{transition:transform .18s var(--ease),background .25s var(--ease),box-shadow .25s var(--ease)}
button:active,.ev:active,.kpi:active,.qa:active,.hero:active,a.cbtn:active{transform:scale(.97)}
.row:active{transform:none;background:rgba(255,255,255,.5)}
.toast{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 10px 30px rgba(123,36,51,.3);animation:toastIn .4s var(--spring)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .list,.ev,.cmp,.tile,.chart,.kpi,.qa,.empty,details.more,.me-card,.side,.sheet,nav.tabs .in{background:var(--surface)}
}
/* ---------- glas v2: mere gennemsigtigt + glidende markører ---------- */
:root{--glass:rgba(255,251,245,.38);--glass-line:rgba(255,255,255,.55)}
html{background:
  radial-gradient(55vmax 45vmax at -5% -5%,rgba(123,36,51,.30),transparent 60%),
  radial-gradient(50vmax 42vmax at 105% 15%,rgba(232,207,154,.60),transparent 62%),
  radial-gradient(55vmax 45vmax at 20% 105%,rgba(92,107,46,.24),transparent 60%),
  radial-gradient(40vmax 35vmax at 90% 95%,rgba(196,90,110,.22),transparent 60%),
  var(--bg) fixed}
.topbar,.top{background:rgba(245,239,227,.38)}
nav.tabs .in{background:rgba(255,251,245,.34)}
.side{background:rgba(255,251,245,.46)}
.sheet{background:rgba(255,251,245,.66)}
label.f input,label.f select,label.f textarea,.status button,.spentbox,label.share,.scanrow{background:rgba(255,255,255,.42)}
/* glidende markør i faner og bundmenu */
.seg.slide,.hseg.slide{position:relative;gap:0}
.seg.slide::before,.hseg.slide::before,nav.tabs .in::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;
  width:calc((100% - 8px) / var(--n,2));transform:translateX(calc(var(--i,0) * 100%));transition:transform .45s var(--spring);
  background:rgba(255,255,255,.82);border-radius:10px;box-shadow:0 1px 0 #fff inset,0 3px 10px rgba(92,40,30,.14)}
.seg.slide button,.hseg.slide button{position:relative;z-index:1}
.seg.slide button[aria-pressed="true"],.hseg.slide button[aria-pressed="true"]{background:none!important;box-shadow:none!important}
nav.tabs .in{position:relative}
nav.tabs .in::before{top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);border-radius:99px;opacity:var(--on,1)}
nav.tabs button{position:relative;z-index:1}
nav.tabs button[aria-current="page"]{background:none!important;box-shadow:none!important}
/* sider glider ind fra siden */
#view.enter-r{animation:slideR .42s var(--spring)}
#view.enter-l{animation:slideL .42s var(--spring)}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-28px)}}
/* fjedrende tryk */
button,.ev,.kpi,.qa,.hero,a.cbtn{transition:transform .35s var(--spring),background .25s var(--ease),box-shadow .25s var(--ease)}
button:active,.ev:active,.kpi:active,.qa:active,.hero:active,a.cbtn:active{transform:scale(.95);transition-duration:.12s}
.sheet.drag{transition:none!important;animation:none!important}
.sheet.back{transition:transform .35s var(--spring)}
</style>

<script type="module">
(() => {
"use strict";
/* ---------- bordkort, kopieret fra Nyx (koordinater i skærmens 920 px bredde) ---------- */
const T = (id, x, y, w, h, cap) => ({ k: "t", id, x, y, w, h, cap });
const R = (id, x, y, w, h, cap) => ({ k: "r", id, x, y, w, h, cap });
const B = (label, x, y, w, h, v) => ({ k: "b", label, x, y, w, h, v });
const H = (x, y, w, h, label) => ({ k: "h", x, y, w, h, label });
const AREAS = [
  { name: "SØ Main", y0: 600, h: 1080, items: [

  return { bs, act, came, expected, sold: soldSum,

const b64uToU8 = (s) => { const r = atob(s.replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(r, (c) => c.charCodeAt(0)); };
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
async function pushState() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "nej";
  if (Notification.permission === "denied") return "afvist";
  try { const reg = await navigator.serviceWorker.getRegistration(); const s = reg && (await reg.pushManager.getSubscription()); return s ? "til" : "fra"; } catch { return "fra"; }
}
async function pushOn() {
  if (!("Notification" in window) || !("PushManager" in window)) return toast(standalone() ? "Telefonen kan ikke få notifikationer her." : "Læg Bordbog på hjemmeskærmen først og åbn den derfra.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return toast("Du sagde nej til notifikationer. Slå dem til under Indstillinger → Bordbog.");
  try {
    const reg = await navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready);
    const { key } = await (await fetch("/api/notify")).json();
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(key) }));
    const j = sub.toJSON();
    const { error } = await store.sb.from("nyx_push").upsert({ endpoint: j.endpoint, user_id: store.uid, sub: j });
    if (error) throw error;
    toast("Notifikationer er slået til"); ui.pushNow = "til"; render();
  } catch (e) { toast("Kunne ikke slå notifikationer til: " + (e.message || e)); }
}

}

  if ((x = t("[data-preplus]"))) return prePlus(x.dataset.preplus);
  if ((x = t("[data-act=newkunde]"))) return kundeSheet("");
  if ((x = t("[data-stab]"))) { ui.stab = x.dataset.stab; return render(); }
  if ((x = t("[data-tf]"))) { ui.tf = x.dataset.tf; return render(); }
  if ((x = t("[data-month]"))) { ui.month = shiftMonth(ui.month, Number(x.dataset.month)); return render(); }
  if ((x = t("[data-nseg]"))) { ui.noteSeg = x.dataset.nseg; return render(); }
  if ((x = t("[data-party]"))) return partySheet(S.notes.find((n) => n.id === x.dataset.party));
  if ((x = t("[data-delnote]"))) return safe(store.del("notes", x.dataset.delnote));
  if ((x = t("[data-followed]"))) { const b = S.bookings.find((y) => y.id === x.dataset.followed); return b && safe(store.put("bookings", { ...b, followed: true }), "Klaret"); }
  if ((x = t("[data-thank]"))) { const b = S.bookings.find((y) => y.id === x.dataset.thank); if (!b) return;
    return copyText(b.status === "kom" ? `Hej ${first(b.name)}! Tak fordi I kom forbi ${eventFor(b.date).name} ${dayLabel(b.date)}. Håber I havde en god aften. Skriv endelig, når I vil have et bord igen, så holder jeg et klar til jer.`
      : `Hej ${first(b.name)}! Vi savnede jer ${dayLabel(b.date)}. Skal jeg holde et bord til jer en anden aften? Skriv bare, hvornår det passer.`); }
  if ((x = t("[data-bdmsg]"))) { const c = customers()[x.dataset.bdmsg]; if (!c) return; const nb = nextBirthday(c.bday, todayISO());
    return copyText(`Hej ${first(c.name)}! Du fylder snart ${nb.age}. Skal vi fejre det? Jeg kan holde et godt bord til dig og dine venner, bare sig hvilken aften.`); }
  if (!(x = t("[data-act]"))) return;
  const act = x.dataset.act;
  if (act === "logout") return store.signOut();
  if (act === "copycode") return copyText(`Hej! Hent Bordbog på ${location.origin}, opret en konto, og skriv koden ${store.team.code} under Salg → Indstillinger og hold.`);
  if (act === "leaveteam") { if (!x.dataset.armed) { x.dataset.armed = "1"; x.textContent = "Tryk igen for at forlade"; return; } return safe(store.rpc("nyx_leave_team", {}).then(() => store.loadAll()), "Du har forladt holdet"); }
  if (act === "seenall") { try { localStorage.setItem(seenKey(), new Date().toISOString()); } catch {} return render(); }
  if (act === "allnews") { ui.allNews = true; return render(); }
  if (act === "back") go("events");
  if (act === "profile") return profileSheet();
  if (act === "scan") startScan();
  if (act === "editnight") nightSheet(ui.date);
  if (act === "newfree") bookingSheet(newBooking(ui.date, "Andet", ""));
  if (act === "newclub") bookingSheet({ ...newBooking(nextNight(), "Andet", ""), club: clubNames().slice(-1)[0] || "Hive" });
  if (act === "newparty") partySheet({ id: newId(), title: "", date: "", people: "", contact: "", expected: "", stage: "ide", text: "", created: Date.now() });
  if (act === "showpast") { ui.showPast = true; render(); }
  if (act === "addnight") { const dt = view.querySelector("#addDate").value; if (dt) go("night", { date: dt }); }
  if (act === "todo") { ui.todoRun = true; ui.todoDone = new Set(); const b = nextTodo(); if (b) bookingSheet(b); }
});

/* swipe mellem faner og træk ark ned */
{
  let sx = 0, sy = 0, ok = false;
  view.addEventListener("touchstart", (e) => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    ok = e.touches.length === 1 && !e.target.closest(".map, .chart, input, textarea, select, .fchips") && !root.querySelector(".scrim");
  }, { passive: true });
  view.addEventListener("touchend", (e) => {
    if (!ok) return; const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 80 || Math.abs(dy) > 45 || sx < 24) return;
    const SWIPE_TABS = ["home", "events", "hive", "stats"];
    const cur = SWIPE_TABS.indexOf(ui.tab === "hivesalg" ? "hive" : ui.tab); if (cur < 0) return;
    const nx = SWIPE_TABS[cur + (dx < 0 ? 1 : -1)]; if (nx) go(nx);
  }, { passive: true });
  // træk et ark ned for at lukke det
  let dy0 = null, sh = null, last = 0;
  root.addEventListener("touchstart", (e) => {
    sh = e.target.closest(".sheet"); if (!sh || sh.scrollTop > 0 || e.target.closest("input, textarea, select")) { sh = null; return; }
    dy0 = e.touches[0].clientY; last = 0;
  }, { passive: true });
  root.addEventListener("touchmove", (e) => {
    if (!sh || dy0 == null) return; last = Math.max(0, e.touches[0].clientY - dy0);
    if (last > 0 && sh.scrollTop <= 0) { sh.classList.add("drag"); sh.style.transform = `translateY(${last}px)`; }
  }, { passive: true });
  root.addEventListener("touchend", () => {
    if (!sh) return; const s = sh; sh = null; dy0 = null; s.classList.remove("drag");
    if (last > 110) { s.style.transform = ""; close(); } else { s.classList.add("back"); s.style.transform = ""; setTimeout(() => s.classList.remove("back"), 360); }
  }, { passive: true });
}

render();
store.start();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
