<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Niels Bordbog</title>
  <meta name="theme-color" content="#f5efe3">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bordbog">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <style>
/* Layout: phone app modelled on the Nyx staff app. Dark only on purpose: same navy, teal and green as Nyx so it feels familiar. */
:root{
  color-scheme:light;
  --bg:#f5efe3; --surface:#fffaf2; --raise:#efe6d6; --line:#e3d7c3; --mapbg:#efe7d8;
  --fg:#2b1d1f; --muted:#7f6e68; --faint:#ab9d93;
  --teal:#7b2433; --pink:#7b2433; --green:#5c6b2e; --green-ink:#fbf6ec; --gold:#e8cf9a;
  --blue:#5c6b2e; --blue-ink:#fbf6ec; --red:#b4685a; --red-ink:#fbf6ec; --purple:#8a6a8f;
  --free:#fffdf8; --free-ink:#3a2a2c; --stripe1:#ece3d3; --stripe2:#e4d9c6;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f);font-size:15px;line-height:1.4;margin:0;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 0}
.top .title{text-align:center;line-height:1.2}
.top .title b{display:block;font-family:var(--serif);font-weight:700;font-size:22px;color:var(--teal)}
.top .title .d{color:var(--pink);font-weight:600}
.top .title span{color:var(--muted);font-size:15px}
.pillbtn{justify-self:start;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600}
.top .right{justify-self:end}
h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}

/* events */
.ev{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.ev.today{border-color:var(--teal)}
.ev{box-shadow:0 1px 2px rgba(80,50,30,.06)}
.ev.thu{background:var(--teal);border-color:var(--teal);color:var(--green-ink)}
.ev.thu .t,.ev.thu .stats{color:#e6c9c4}
.ev.thu .stats b{color:var(--green-ink)}
.ev.thu.today{box-shadow:0 0 0 3px var(--gold)}
.ev .r1,.ev .r2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ev .wd{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.wd.thu{color:var(--gold)}.wd.fri{color:var(--teal)}.wd.sat{color:var(--teal)}.wd.other{color:var(--muted)}
.ev .t{font-size:13px;color:var(--muted)}
.ev .name{font-weight:600;margin-top:2px}
.ev .stats{font-size:13px;color:var(--muted);text-align:right}
.ev .stats b{color:var(--green);font-weight:700}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* night */
.seg{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.seg button{background:none;border:0;padding:12px 0;font-size:16px;color:var(--muted);border-bottom:3px solid transparent}
.seg button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--teal)}
.glist{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:14px}
.glist .k{font-size:13px;color:var(--muted)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--raise);font-size:20px;line-height:1}
.step input{width:56px;text-align:center;font-size:22px;font-weight:700;background:none;border:0}
.areabar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px}
.areabar .nav{display:flex;align-items:center;gap:6px;min-width:0}
.areabar .nav button{width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.areabar .nm{font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counts{display:flex;gap:10px;font-size:18px;font-weight:600}
.c-green{color:var(--teal)}.c-blue{color:var(--blue)}.c-red{color:var(--red)}

.map{position:relative;container-type:inline-size;background:var(--mapbg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.map > *{position:absolute}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:2.3cqw;color:var(--fg);text-align:center}
.blk.v span{transform:rotate(90deg);white-space:nowrap}
.hatch{border:1px solid var(--line);border-radius:4px;background:repeating-linear-gradient(135deg,var(--stripe1) 0 1.6cqw,var(--stripe2) 1.6cqw 3.2cqw);display:grid;place-items:center;font-size:2.3cqw}
.tb{border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:4px;background:var(--free);color:var(--free-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:.4cqw;font-size:2.4cqw;overflow:hidden}
.tb b{font-size:2.9cqw}
.tb small{font-size:2.2cqw;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb.round{border-radius:99px}
.tb.booket,.tb.kom,.tb.udeblev{box-shadow:none}
.tb.booket{background:var(--teal);color:var(--green-ink)}
.tb.kom{background:var(--blue);color:var(--blue-ink)}
.tb.udeblev{background:var(--red);color:var(--red-ink)}
.maptip{font-size:13px;color:var(--muted);margin-top:8px}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.tag{min-width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:var(--free);color:var(--free-ink);padding:0 6px}
.tag.booket{background:var(--teal);color:var(--green-ink)}.tag.kom{background:var(--blue);color:var(--blue-ink)}.tag.udeblev{background:var(--red);color:var(--red-ink)}.tag.aflyst{background:var(--raise);color:var(--muted)}
.mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.mid .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;font-weight:700}
.right small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.empty{padding:20px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.teal{background:var(--teal);color:var(--green-ink);border-color:var(--teal)}
.btn.danger{color:var(--red)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;color:var(--muted)}

/* stats */
.monthsw{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.monthsw strong{font-size:17px;text-transform:capitalize}
.monthsw button{width:36px;height:36px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:12px}
.cmp .line{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;font-size:14px}
.cmp .bar{height:12px;border-radius:99px;background:var(--raise);overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:99px}
.cmp .big{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1}
.cmp .sub{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .v{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--green)}
.tile .k{font-size:12px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 4px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--f);font-size:11px}
.chart .val{fill:var(--fg);font-weight:600}
.todo{border-color:var(--pink)}

/* notes */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--teal);color:var(--fg)}
.idea{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.idea:first-child{border-top:0}
.idea input[type=checkbox]{width:20px;height:20px;margin-top:1px;accent-color:var(--teal)}
.idea p{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.idea.done p{color:var(--faint);text-decoration:line-through}
.idea button{background:none;border:0;color:var(--faint);font-size:18px;line-height:1;padding:0 2px}
.quick{display:flex;gap:8px;margin-bottom:10px}
.quick input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}

.fu{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.fu:first-child{border-top:0}
.fu .acts{display:flex;gap:6px}
.fu .acts button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}
.fu .acts button.ok{background:var(--teal);color:var(--green-ink);border-color:var(--teal)}
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .logo{font-family:var(--serif);font-weight:700;font-size:56px;letter-spacing:.08em;color:var(--teal);line-height:1}
.login .err{color:var(--red);font-size:14px;min-height:1.2em;margin:0}
[hidden]{display:none!important}
/* tabbar (Nyx style pill) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px;box-shadow:0 8px 24px rgba(80,50,30,.14)}
nav.tabs button{border:0;background:none;border-radius:99px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:12px;font-weight:700;color:var(--fg)}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{background:var(--bg);color:var(--teal)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 12px);overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--serif);font-size:24px;color:var(--teal);margin:0 0 4px}
.sheet .sh{color:var(--muted);font-size:14px;margin:0 0 14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;width:100%;min-width:0;color:var(--fg)}
label.f textarea{min-height:60px;resize:vertical}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.status button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0;font-size:13px;font-weight:700;color:var(--muted)}
.status button[aria-pressed="true"].booket{background:var(--teal);color:var(--green-ink);border-color:var(--teal)}
.status button[aria-pressed="true"].kom{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.status button[aria-pressed="true"].udeblev{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.status button[aria-pressed="true"].aflyst{background:var(--raise);color:var(--fg)}
.sheet .btns{margin-top:16px;justify-content:space-between}
.toast{background:var(--teal)!important;color:var(--green-ink)!important;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px}
.foot{font-size:12px;color:var(--faint);text-align:center;padding-top:18px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.scanbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:4px 0 14px}
.scanbar{height:6px;border-radius:99px;background:var(--raise);overflow:hidden;margin-top:14px}
.scanbar i{display:block;height:100%;width:40%;background:var(--green);border-radius:99px;animation:scan 1.2s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateX(-20%)}to{transform:translateX(170%)}}
.scanlist{display:flex;flex-direction:column;gap:10px}
.scanrow{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg)}
.scanrow.off{opacity:.5}
.scanrow.off .sgrid{display:none}
.scanrow .chk{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;margin-bottom:8px}
.scanrow .chk input{width:20px;height:20px;accent-color:var(--teal)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sgrid .full{grid-column:1/-1}
label.f small.mer{text-transform:none;letter-spacing:0;font-size:13px;color:var(--green);font-weight:700}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--teal)}
.srow .right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.linkbtn{background:none;border:0;color:var(--teal);font-weight:700;font-size:13px;padding:2px 0}
.scanrow .sgrid{margin-top:10px}
.scanrow.off .srow .mid,.scanrow.off .srow .right{opacity:.6}
.spentbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.spentbox .sbh{grid-column:1/-1;font-family:var(--serif);font-size:17px;color:var(--teal)}
.spentbox [data-minonly]{align-self:center}
.badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:99px;background:var(--teal);color:var(--green-ink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
nav.tabs button{position:relative}
.row.news .dot{width:10px;height:10px;border-radius:99px;background:transparent;align-self:start;margin-top:6px}
.row.news.new .dot{background:var(--teal)}
.row.news.new .t{font-weight:700}
label.share{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
label.share input{width:22px;height:22px;accent-color:var(--teal);margin-top:2px}
label.share small{color:var(--muted)}
.cmp.pool{margin-bottom:12px}
#l-toggle{margin-top:6px}
.avatar{justify-self:end;width:38px;height:38px;border-radius:99px;border:0;background:var(--teal);color:var(--green-ink);font-weight:800;font-size:14px;display:grid;place-items:center;letter-spacing:.02em}
.avatar.big{width:56px;height:56px;font-size:20px;flex:none}
.phead{display:flex;gap:14px;align-items:center}
</style>
</head>
<body>
<div class="wrap"><main id="view"><p class="note" style="padding-top:24px">Henter dine bookinger…</p></main><p class="foot" id="status"></p></div>

<nav class="tabs" aria-label="Sektioner"><div class="in">
  <button data-tab="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2"/></svg>Events</button>
  <button data-tab="borde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3l7 7-9 9a3 3 0 0 1-4 0l-3-3a3 3 0 0 1 0-4z M16 5l3 3"/></svg>Borde</button>
  <button data-tab="hive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l8 4.6v9.2L12 22l-8-6.2V6.6z M12 8l3.5 2v4L12 16l-3.5-2v-4z"/></svg>Hive</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/></svg>Statistik</button>
  <button data-tab="noter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V16h5v-.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3z"/></svg>Noter</button>
</div></nav>
<div id="sheetRoot"></div>

<script type="module">
(() => {
"use strict";
/* ---------- bordkort, kopieret fra Nyx (koordinater i skærmens 920 px bredde) ---------- */
const T = (id, x, y, w, h, cap) => ({ k: "t", id, x, y, w, h, cap });
const R = (id, x, y, w, h, cap) => ({ k: "r", id, x, y, w, h, cap });
const B = (label, x, y, w, h, v) => ({ k: "b", label, x, y, w, h, v });
const H = (x, y, w, h, label) => ({ k: "h", x, y, w, h, label });
const AREAS = [
  { name: "SØ Main", y0: 600, h: 1080, items: [
    B("Podie", 0, 617, 95, 93), T("2", 116, 617, 94, 93, ""), T("1", 0, 733, 95, 93, ""), H(432, 617, 170, 218, "Bar 2"), H(882, 617, 38, 142),

/* ---------- storage: Supabase med login (samme konto som Goon), ellers demo i browseren ---------- */
const DK_ERR = { "Invalid login credentials": "Forkert email eller adgangskode", "Email not confirmed": "Din email er ikke bekræftet endnu" };
const store = {
  sb: null, mode: "venter", uid: null, meta: {}, team: null, members: [], news: [], teamOk: false, pool: {},
  async start() {
    const cfg = await import("./js/config.js");
    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) return this.startLocal("Demo: tallene gemmes kun i denne browser.");
    try {
      const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm");
      this.sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: true } });
    } catch { setStatus("Kunne ikke forbinde. Tjek internettet og genindlæs."); return; }
    this.mode = "sky";
    const { data } = await this.sb.auth.getSession();
    this.uid = data.session?.user?.id || null; this.email = data.session?.user?.email || "";
    if (!this.uid) return showLogin();
    await this.afterLogin();
  },
  async signIn(email, password) {
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error(DK_ERR[error.message] || error.message);
    this.uid = data.user.id; this.email = data.user.email || "";
    await this.afterLogin();
  },
  async signOut() { if (this.sb) await this.sb.auth.signOut(); location.reload(); },
  async afterLogin() {
    document.querySelector("nav.tabs").hidden = false;
    await this.loadAll();
    let t = null;
    const later = () => { clearTimeout(t); t = setTimeout(() => this.loadAll(), 400); };
    this.sb.channel("nyx-" + this.uid).on("postgres_changes", { event: "*", schema: "public", table: "nyx_docs", filter: "owner=eq." + this.uid }, later).subscribe();
    this.later = later; this.listenTeam();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") this.loadAll(); });
    setStatus("Gemt i din konto og opdateres live på alle dine enheder.");
  },
  async loadAll() {
    let res = await this.sb.from("nyx_docs").select("col,id,data,owner,team");
    if (res.error && /team/.test(res.error.message)) res = await this.sb.from("nyx_docs").select("col,id,data,owner");
    const { data, error } = res;
    if (error) { setStatus(/does not exist|schema cache/i.test(error.message) ? "Tabellen findes ikke endnu. Kør supabase/nyx.sql i Supabase." : "Kunne ikke hente dine tal: " + error.message); S.ready = true; render(); return; }
    const by = { bookings: [], nights: [], notes: [] }; let settings = {}; this.meta = {};
    data.forEach((r) => {
      this.meta[r.col + ":" + r.id] = { owner: r.owner, team: r.team || null };
      const own = r.owner === this.uid;
      if (r.col === "settings") { if (own) settings = r.data; }
      else if (r.col === "bookings" || own) by[r.col] && by[r.col].push({ ...r.data, id: r.id });
    });
    await this.loadTeam();
    Object.assign(S, by, { settings: { pct: 0, ...settings }, ready: true });
    render();
  },
  async loadTeam() {
    const m = await this.sb.from("nyx_members").select("user_id,team_id,name");
    if (m.error) { this.teamOk = false; this.team = null; this.members = []; return; }
    this.teamOk = true; this.members = m.data || [];
    const me = this.members.find((x) => x.user_id === this.uid);
    if (!me) { this.team = null; this.news = []; return; }
    const t = await this.sb.from("nyx_teams").select("id,name,code").eq("id", me.team_id).maybeSingle();
    this.team = t.data || { id: me.team_id, name: "Holdet", code: "" };
    const n = await this.sb.from("nyx_news").select("id,actor,owner,booking,text,created_at").order("created_at", { ascending: false }).limit(40);
    this.news = n.data || [];
    this.pool = {}; this.listenTeam();
  },
  listenTeam() {
    if (!this.team || !this.later || this.teamCh === this.team.id) return;
    this.teamCh = this.team.id;
    this.sb.channel("hold-" + this.team.id)
      .on("postgres_changes", { event: "*", schema: "public", table: "nyx_docs", filter: "team=eq." + this.team.id }, this.later)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "nyx_news", filter: "team_id=eq." + this.team.id }, this.later)
      .on("postgres_changes", { event: "*", schema: "public", table: "nyx_members", filter: "team_id=eq." + this.team.id }, this.later).subscribe();
  },
  async rpc(fn, args) { const { data, error } = await this.sb.rpc(fn, args); if (error) throw new Error(error.message); return data; },
  async poolFor(ym) {
    const k = ym; if (this.pool[k]) return this.pool[k];
    this.pool[k] = "henter";
    try { this.pool[k] = await this.rpc("nyx_team_stats", { p_from: payStart(ym), p_to: payEnd(ym) }); } catch { this.pool[k] = null; }
    render(); return this.pool[k];
  },
  startLocal(msg) {
    this.mode = "lokal";
    try { const raw = JSON.parse(localStorage.getItem("nyx-promoter-2") || "null"); if (raw) Object.assign(S, raw); } catch {}
    S.ready = true; setStatus(msg); render();
  },
  saveLocal() { try { localStorage.setItem("nyx-promoter-2", JSON.stringify({ bookings: S.bookings, nights: S.nights, notes: S.notes, settings: S.settings })); } catch {} },
  local(col, obj, del) {
    const arr = S[col], id = del ? obj : obj.id, i = arr.findIndex((x) => x.id === id);
    if (del) { if (i >= 0) arr.splice(i, 1); } else i >= 0 ? (arr[i] = obj) : arr.push(obj);
    if (this.mode !== "sky") this.saveLocal();
    render();
  },
  async put(col, obj) {
    if (this.mode === "sky") {
      const { id, ...data } = obj, m = this.meta[col + ":" + id], now = new Date().toISOString();
      if (m && m.owner !== this.uid) {
        const { error } = await this.sb.from("nyx_docs").update({ data, updated_at: now }).match({ owner: m.owner, col, id });
        if (error) throw error;
      } else {
        const team = col === "bookings" && obj.shared && this.team ? this.team.id : null;
        const row = { owner: this.uid, col, id, data, updated_at: now };
        if (this.teamOk) row.team = team;
        const { error } = await this.sb.from("nyx_docs").upsert(row);
        if (error) throw error;
        this.meta[col + ":" + id] = { owner: this.uid, team };
      }
      Object.values(this.pool).length && (this.pool = {});
    }
    this.local(col, obj);
  },
  async del(col, id) {
    if (this.mode === "sky") { const { error } = await this.sb.from("nyx_docs").delete().match({ owner: this.uid, col, id }); if (error) throw error; }
    this.local(col, id, true);
  },
  async settings(s) {
    if (this.mode === "sky") { const { error } = await this.sb.from("nyx_docs").upsert({ owner: this.uid, col: "settings", id: "main", data: s, updated_at: new Date().toISOString() }); if (error) throw error; }
    S.settings = s; if (this.mode !== "sky") this.saveLocal(); render();
  },
};

function showLogin(signup) {
  document.querySelector("nav.tabs").hidden = true;
  view.innerHTML = `<form class="login" id="loginForm">
    <div class="logo">NIELS</div><p style="margin:0;font-weight:700;letter-spacing:.2em;color:var(--muted)">BORDBOG</p>
    <p class="note">${signup ? "Opret en konto med din email. Bagefter kan du komme på et hold med en kode." : "Log ind med din email og adgangskode."}</p>
    <label class="f">Email<input id="l-email" type="email" autocomplete="email" required></label>
    <label class="f">Adgangskode<input id="l-pass" type="password" autocomplete="${signup ? "new-password" : "current-password"}" minlength="6" required></label>
    <p class="err" id="l-err"></p><button class="btn teal" type="submit">${signup ? "Opret konto" : "Log ind"}</button>
    <button class="btn" type="button" id="l-toggle">${signup ? "Jeg har en konto" : "Opret ny konto"}</button></form>`;
  view.querySelector("#l-toggle").addEventListener("click", () => showLogin(!signup));
  view.querySelector("#loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); e.stopPropagation();

    const b = f.querySelector("button[type=submit]"); b.disabled = true; b.textContent = signup ? "Opretter…" : "Logger ind…";
    try {
      if (signup) {
        const { data, error } = await store.sb.auth.signUp({ email, password: pass });
        if (error) throw new Error(DK_ERR[error.message] || error.message);
        if (!data.session) { showLogin(false); view.querySelector("#l-err").textContent = "Tjek din mail og tryk på linket. Log derefter ind her."; return; }
        store.uid = data.user.id; view.innerHTML = '<p class="note" style="padding-top:24px">Gør klar…</p>'; return store.afterLogin();
      }
      view.innerHTML = '<p class="note" style="padding-top:24px">Henter dine bookinger…</p>'; await store.signIn(email, pass);
    } catch (err) { showLogin(signup); view.querySelector("#l-err").textContent = err.message; }
  });
}

function monthStats(ym) {
  const bs = myBookings().filter((b) => inPay(b.date, ym));
  const act = bs.filter(active), came = bs.filter((b) => b.status === "kom"), withSpent = came.filter((b) => num(b.spent));

  const nights = S.nights.filter((n) => inPay(n.id, ym) && num(n.guestlist));
  const expected = act.reduce((a, b) => a + num(b.expected), 0), soldSum = came.reduce((a, b) => a + num(b.spent), 0);
  return { bs, act, came, expected, sold: soldSum,
    avgExp: act.length ? expected / act.length : 0,
    avgSold: withSpent.length ? soldSum / withSpent.length : 0,
    expOfCame: withSpent.reduce((a, b) => a + num(b.expected), 0),
    show: decided.length ? Math.round(came.length / decided.length * 100) : null,
    guests: nights.reduce((a, n) => a + num(n.guestlist), 0), guestNights: nights.length,

}

async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file); const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((ok) => c.toBlob((b) => ok(b || file), "image/jpeg", 0.85));
  } catch { return file; }
}

  const inp = scanInput;
  inp.addEventListener("change", async () => {
    const all = [...inp.files];
    if (!all.length) return;
    root.innerHTML = `<div class="scrim"><div class="sheet"><h3>Scanner…</h3><p class="sh">Gør klar…</p><div class="scanbar"><i></i></div></div></div>`;
    if (!(await scanEngine.ready())) return scanMsg("Scanning er ikke tilgængelig", "Du skal være logget ind for at scanne.");
    const files = all.slice(0, scanEngine.max);
    if (inp.files.length > files.length) toast(`Kun de første ${files.length} billeder bliver scannet.`);
    root.innerHTML = `<div class="scrim"><div class="sheet"><h3>Scanner…</h3><p class="sh">Læser ${files.length} ${files.length === 1 ? "billede" : "billeder"} fra Nyx. Det tager typisk 10 til 30 sekunder.</p><div class="scanbar"><i></i></div></div></div>`;
    try {
      const blobs = await Promise.all(files.map(shrink));
      const out = await scanEngine.read(blobs, scanPrompt(blobs.length));
      const rows = (Array.isArray(out) ? out : out && out.rows || []).map((r) => {
        const date = /^\d{4}-\d{2}-\d{2}$/.test(r.date || "") ? r.date : "";
        return { date, area: String(r.area || "").trim(), table: String(r.table ?? "").trim(), name: String(r.name || "").trim(),
          guests: num(r.arrived) || num(r.booked), price: num(r.amount), came: num(r.arrived) > 0 && (!date || date <= todayISO()),
          note: String(r.note || "").trim(), promoter: String(r.promoter || "").trim() };
      });
      reviewScan(rows, out && out.note);
    } catch (e) { scanMsg("Scanningen virkede ikke", e.message || "Ukendt fejl."); }
  });
}
function reviewScan(rows, note) {
  if (!rows.length) return scanMsg("Ingen af dine borde fundet", (note ? note + " " : "") + "Tjek at der står Niels Priess på bordene, og at billederne er fra Tables → List i Nyx.");
  const anyPromoter = rows.some((r) => r.promoter), from = payStart(payYm(todayISO()));
  const html = rows.map((r, i) => {
    const m = r.date && matchBooking(r), old = r.date && r.date < from, on = (!anyPromoter || isMe(r.promoter)) && !old;
    const tag = old ? "før lønperioden" : m ? "opdateres" : "ny";
    return `<div class="scanrow ${on ? "" : "off"}" data-i="${i}">
      <div class="srow"><input type="checkbox" data-pick ${on ? "checked" : ""} aria-label="Gem bord ${esc(r.table)}">
        <span class="mid"><span class="t">${esc(r.table ? "Bord " + r.table : "Bord ?")} · ${esc(r.name || "Uden navn")}</span>
        <span class="s">${r.date ? dayLabel(r.date) : "Mangler dato"} · ${r.guests || 0} gæster${r.came ? " · kom" : ""} · ${tag}</span></span>
        <span class="right num">${r.price ? kr(r.price) : "–"}<button type="button" class="linkbtn" data-edit>Ret</button></span></div>
      <div class="sgrid" hidden>
        <label class="f">Dato<input type="date" data-k="date" value="${esc(r.date)}"></label>
        <label class="f">Bord<input data-k="table" value="${esc(r.table)}"></label>
        <label class="f full">Kunde<input data-k="name" value="${esc(r.name)}"></label>
        <label class="f">Gæster<input data-k="guests" inputmode="numeric" value="${r.guests || ""}"></label>
        <label class="f">Bordpris (kr.)<input data-k="price" inputmode="numeric" data-money value="${fmtIn(r.price)}"></label>
        ${r.note ? `<p class="full note" style="margin:0">${esc(r.note)}</p>` : ""}
      </div></div>`;
  }).join("");
  const f = openSheet(`<h3>Fundet ${rows.length} ${rows.length === 1 ? "bord" : "borde"}</h3>
    <p class="sh">${anyPromoter ? `Dine borde (${meNyx()})` : "Alle borde"} fra ${d(from).getDate()}. ${mShort(from)} og frem er valgt. Tryk Ret, hvis noget er læst forkert. Hvad de brugte, skriver du bagefter under Statistik.${note ? "<br>" + esc(note) : ""}</p>
    <form class="form"><div class="full scanlist">${html}</div>
    <div class="full btns"><button type="button" class="btn" data-close>Annullér</button><button class="btn teal" type="submit">Gem valgte</button></div></form>`, (form) => {
    const picked = [...form.querySelectorAll(".scanrow")].filter((el) => el.querySelector("[data-pick]").checked).map((el) => {
      const g = (k) => el.querySelector(`[data-k="${k}"]`).value.trim(), r = rows[el.dataset.i];
      return { ...r, date: g("date"), table: g("table"), name: g("name"), guests: num(g("guests")), price: num(g("price")) };
    });
    const bad = picked.find((r) => !r.date);
    if (bad) { toast("Et valgt bord mangler dato."); return false; }
    importScan(picked);
  });
  f.querySelectorAll("[data-pick]").forEach((c) => c.addEventListener("change", () => c.closest(".scanrow").classList.toggle("off", !c.checked)));
  f.querySelectorAll("[data-edit]").forEach((x) => x.addEventListener("click", () => { const g = x.closest(".scanrow").querySelector(".sgrid"); g.hidden = !g.hidden; x.textContent = g.hidden ? "Ret" : "Skjul"; }));
}
function scanMsg(title, text) {
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p class="sh" style="user-select:text">${esc(text)}</p><div class="btns" style="justify-content:flex-end"><button class="btn teal" data-close>OK</button></div></div></div>`;
  root.querySelector("#scrim").addEventListener("click", (e) => { if (e.target.id === "scrim" || e.target.closest("[data-close]")) close(); });
}
async function importScan(rows) {
  let nNew = 0, nUpd = 0;
  try {
    for (const r of rows) {
      const old = matchBooking(r);
      const area = AREA_OF[r.table] || (AREAS.some((A) => A.name === r.area) ? r.area : "Andet");
      const b = old ? { ...old } : newBooking(r.date, area, r.table);
      if (r.name && !b.name) b.name = r.name;
      if (r.guests) b.guests = r.guests;
      if (r.price) b.expected = r.price;
      if (r.came && b.status === "booket") b.status = "kom";
      if (!old) b.notes = [r.note, area === "Andet" && r.area ? r.area : ""].filter(Boolean).join(" · ") || "Fra Nyx";
      await store.put("bookings", b); old ? nUpd++ : nNew++;
    }
    const sum = rows.reduce((a, r) => a + num(r.price), 0);
    scanMsg(rows.length ? "Gemt" : "Intet valgt", rows.length ? `${nNew} nye og ${nUpd} opdaterede borde, ${kr(sum)} i bordpriser. Gå til Statistik → Borde i lønperioden og skriv, hvad de brugte, når du ved det.` : "Du skal sætte flueben ved de borde, der skal gemmes.");
  } catch (e) { scanMsg("Kunne ikke gemme", `${nNew + nUpd} af ${rows.length} borde blev gemt. Fejl: ${(e && (e.message || e.code)) || "ukendt"}`); }
}
/* ---------- /scan ---------- */

/* ---------- events wiring ---------- */
document.querySelector("nav.tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  if (b.dataset.tab === "borde") go("night", { date: ui.date || nextNight() }); else go(b.dataset.tab);
});
let glTimer = null;
function setGuestlist(date, val) {
  const n = nightOf(date) || { id: date, event: "", time: "", notes: "" };
  n.guestlist = Math.max(0, val);
  if (!nightOf(date)) S.nights.push(n);
  clearTimeout(glTimer); glTimer = setTimeout(() => safe(store.put("nights", { ...n })), 600);
}
view.addEventListener("input", (e) => { if (e.target.id === "gl") setGuestlist(ui.date, num(e.target.value)); });
view.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "teamNew") { const f = e.target; return safe(store.rpc("nyx_create_team", { p_team: f.querySelector("#t-name").value, p_name: f.querySelector("#t-me").value }).then(() => store.loadAll()), "Holdet er oprettet"); }
  if (e.target.id === "teamJoin") { const f = e.target; return store.rpc("nyx_join_team", { p_code: f.querySelector("#j-code").value, p_name: f.querySelector("#j-me").value }).then(() => store.loadAll()).then(() => toast("Du er på holdet"), (err) => toast(/findes ikke/.test(err.message) ? "Koden findes ikke" : /allerede/.test(err.message) ? "Du er allerede på et hold" : "Kunne ikke tilslutte")); }
  if (e.target.id === "setForm") safe(store.settings({ ...S.settings, pct: num(e.target.querySelector("#s-pct").value) }), "Gemt");
  if (e.target.id === "ideaForm") { const t = e.target.querySelector("#ideaText").value.trim(); if (t) safe(store.put("notes", { id: newId(), kind: "ide", text: t, done: false, created: Date.now() })); }
});
view.addEventListener("change", (e) => {
  if (e.target.id === "hiveDate" && e.target.value) { ui.hiveDate = e.target.value; return render(); }
  const id = e.target.dataset.done; if (!id) return;
  const n = S.notes.find((x) => x.id === id); if (n) safe(store.put("notes", { ...n, done: e.target.checked }));
});
view.addEventListener("click", (e) => {
  const t = (s) => e.target.closest(s);
  let x;
  if ((x = t("[data-night]"))) return go("night", { date: x.dataset.night });
  if ((x = t("[data-mode]"))) { ui.mode = x.dataset.mode; return render(); }
  if ((x = t("[data-area]"))) { ui.area = (ui.area + Number(x.dataset.area) + AREAS.length) % AREAS.length; return render(); }
  if ((x = t("[data-gl]"))) { const inp = view.querySelector("#gl"); const nv = Math.max(0, num(inp.value) + Number(x.dataset.gl)); inp.value = nv; return setGuestlist(ui.date, nv); }
  if ((x = t("[data-hive]"))) { const id = x.dataset.hive; return bookingSheet(hiveAt(ui.hiveDate, id) || { ...newBooking(ui.hiveDate, "Hive", id), club: "Hive" }); }
  if ((x = t("[data-hday]"))) { ui.hiveDate = addDays(ui.hiveDate, Number(x.dataset.hday)); return render(); }
  if ((x = t("[data-table]"))) { const A = AREAS[ui.area]; return bookingSheet(bookingAt(ui.date, A.name, x.dataset.table) || newBooking(ui.date, A.name, x.dataset.table)); }
  if ((x = t("[data-news]"))) { try { localStorage.setItem(seenKey(), new Date().toISOString()); } catch {} const b = S.bookings.find((y) => y.id === x.dataset.news); render(); return b ? bookingSheet(b) : toast("Bordet er ikke delt mere"); }
  if ((x = t("[data-booking]"))) return bookingSheet(S.bookings.find((b) => b.id === x.dataset.booking));
  if ((x = t("[data-month]"))) { ui.month = shiftMonth(ui.month, Number(x.dataset.month)); return render(); }
  if ((x = t("[data-nseg]"))) { ui.noteSeg = x.dataset.nseg; return render(); }
  if ((x = t("[data-party]"))) return partySheet(S.notes.find((n) => n.id === x.dataset.party));
  if ((x = t("[data-delnote]"))) return safe(store.del("notes", x.dataset.delnote));
  if ((x = t("[data-followed]"))) { const b = S.bookings.find((y) => y.id === x.dataset.followed); return b && safe(store.put("bookings", { ...b, followed: true }), "Klaret"); }
  if ((x = t("[data-thank]"))) { const b = S.bookings.find((y) => y.id === x.dataset.thank); if (!b) return;
    return copyText(b.status === "kom" ? `Hej ${first(b.name)}! Tak fordi I kom forbi ${eventFor(b.date).name} ${dayLabel(b.date)}. Håber I havde en god aften. Skriv endelig, når I vil have et bord igen, så holder jeg et klar til jer.`
      : `Hej ${first(b.name)}! Vi savnede jer ${dayLabel(b.date)}. Skal jeg holde et bord til jer en anden aften? Skriv bare, hvornår det passer.`); }
  if ((x = t("[data-bdmsg]"))) { const c = customers()[x.dataset.bdmsg]; if (!c) return; const nb = nextBirthday(c.bday, todayISO());
    return copyText(`Hej ${first(c.name)}! Du fylder snart ${nb.age}. Skal vi fejre det? Jeg kan holde et godt bord til dig og dine venner, bare sig hvilken aften.`); }
  if (!(x = t("[data-act]"))) return;
  const act = x.dataset.act;
  if (act === "logout") return store.signOut();
  if (act === "copycode") return copyText(`Hej! Hent Bordbog på ${location.origin}, opret en konto, og skriv koden ${store.team.code} under Statistik → Hold.`);
  if (act === "leaveteam") { if (!x.dataset.armed) { x.dataset.armed = "1"; x.textContent = "Tryk igen for at forlade"; return; } return safe(store.rpc("nyx_leave_team", {}).then(() => store.loadAll()), "Du har forladt holdet"); }
  if (act === "seenall") { try { localStorage.setItem(seenKey(), new Date().toISOString()); } catch {} return render(); }
  if (act === "allnews") { ui.allNews = true; return render(); }
  if (act === "back") go("events");
  if (act === "profile") return profileSheet();
  if (act === "scan") startScan();
  if (act === "editnight") nightSheet(ui.date);
  if (act === "newfree") bookingSheet(newBooking(ui.date, "Andet", ""));
  if (act === "newclub") bookingSheet({ ...newBooking(nextNight(), "Andet", ""), club: clubNames().slice(-1)[0] || "Hive" });
  if (act === "newparty") partySheet({ id: newId(), title: "", date: "", people: "", contact: "", expected: "", stage: "ide", text: "", created: Date.now() });
  if (act === "showpast") { ui.showPast = true; render(); }
  if (act === "addnight") { const dt = view.querySelector("#addDate").value; if (dt) go("night", { date: dt }); }
  if (act === "todo") { ui.todoRun = true; ui.todoDone = new Set(); const b = nextTodo(); if (b) bookingSheet(b); }
});

render();
store.start();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
